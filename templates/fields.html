<input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="description">Description</label><input id="description" name="description" required maxlength="120" value="{{ item.description if item else '' }}" placeholder="Weekly groceries"><div class="grid"><div><label for="amount">Amount (£)</label><input id="amount" name="amount" type="number" step="0.01" min="0.01" max="9999999999.99" required value="{{ item.amount if item else '' }}"></div><div><label for="kind">Type</label><select id="kind" name="kind">{% for kind in ['expense','income'] %}<option value="{{ kind }}" {{ 'selected' if item and item.kind == kind }}>{{ kind|title }}</option>{% endfor %}</select></div><div><label for="category">Category</label><select id="category" name="category">{% for choice in choices %}<option {{ 'selected' if item and item.category == choice }}>{{ choice }}</option>{% endfor %}</select></div><div><label for="day">Date</label><input id="day" name="day" type="date" required value="{{ item.day if item else today }}"></div></div>
