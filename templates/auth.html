{% extends 'base.html' %}{% block content %}<section class="card auth"><h1>{{ title }}</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="username">Username</label><input id="username" name="username" required minlength="3" maxlength="40" autocomplete="username"><label for="password">Password</label><input id="password" name="password" type="password" required minlength="8" maxlength="128" autocomplete="{{ 'new-password' if register else 'current-password' }}"><p><button>{{ title }}</button></p></form><a href="{{ '/login' if register else '/register' }}">{{ 'Already registered? Log in' if register else 'Create an account' }}</a></section>{% endblock %}
