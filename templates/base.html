<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title }} | {{ config.APP_TITLE }}</title><meta name="description" content="{{ config.APP_DESCRIPTION }}"><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><header><a href="/">{{ config.APP_TITLE }}</a><nav>{% if session.get('user_id') %}<form method="post" action="/logout"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button>Log out</button></form>{% elif config.HAS_AUTH %}<a href="/login">Log in</a><a href="/register">Register</a>{% endif %}</nav></header><main>{% for message in get_flashed_messages() %}<p class="notice" role="alert">{{ message }}</p>{% endfor %}{% block content %}{% endblock %}</main>{% block scripts %}{% endblock %}</body></html>
