services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: local-demo-only
      POSTGRES_DB: portfolio
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      DATABASE_URL: postgresql+psycopg://portfolio:local-demo-only@db:5432/portfolio
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in your local .env file}
    volumes:
      - app-data:/app/instance
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres-data:
  app-data:
